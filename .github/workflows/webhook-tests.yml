name: Webhook Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ── PR gate ────────────────────────────────────────────────────────────────
  test:
    name: Lint + Collection Run
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Install Postman CLI
        run: curl -o- "https://dl-cli.pstmn.io/install/unix.sh" | sh

      - name: Authenticate Postman
        run: postman login --with-api-key "${{ secrets.POSTMAN_API_KEY }}"

      - name: Lint collection
        run: postman collection lint "postman/collections/Hookdeck Webhook Tests" -f error

      - name: Lint environment
        run: postman environment lint postman/environments/Hookdeck.environment.yaml -f error

      - name: Run webhook tests
        run: |
          postman collection run "postman/collections/Hookdeck Webhook Tests" \
            --environment postman/environments/Hookdeck.environment.yaml \
            --env-var "webhook_secret=${{ secrets.HOOKDECK_WEBHOOK_SECRET }}" \
            --timeout-request 10000
        # webhook_secret overrides the committed placeholder so HMAC signatures
        # are computed with the real secret. hookdeck_source_url and
        # hookdeck_retry_source_url are committed in the environment file
        # (they are not secrets). No local server or tunnel is needed —
        # all assertions check Hookdeck's immediate sender response (200/401),
        # not downstream delivery.

  # ── Post-merge publish ─────────────────────────────────────────────────────
  publish:
    name: Publish to Postman Workspace
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Install Postman CLI
        run: curl -o- "https://dl-cli.pstmn.io/install/unix.sh" | sh

      - name: Authenticate Postman
        run: postman login --with-api-key "${{ secrets.POSTMAN_API_KEY }}"

      - name: Publish collection and environment to workspace
        run: |
          postman workspace push -y \
            --message "ci: publish from ${{ github.sha }} — ${{ github.event.head_commit.message }}"
