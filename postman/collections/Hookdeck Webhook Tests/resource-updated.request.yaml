$kind: http-request
name: 'resource.updated'
order: 2000
method: POST
url: '{{hookdeck_source_url}}'
headers:
  - key: Content-Type
    value: application/json
  - key: X-Event-Type
    value: resource.updated
  - key: X-Idempotency-Key
    value: '{{idempotency_key}}'
body:
  type: json
  content: |-
    {
      "id": "{{$randomUUID}}",
      "event": "resource.updated",
      "created_at": "{{$isoTimestamp}}",
      "data": {
        "resource_id": "res_001",
        "resource_type": "order",
        "status": "fulfilled",
        "previous_status": "pending",
        "attributes": {
          "name": "Test Order",
          "amount": 9900,
          "currency": "USD"
        }
      }
    }
scripts:
  - type: beforeRequest
    code: |-
      const eventId = pm.variables.replaceIn('{{$randomUUID}}');
      const timestamp = new Date().toISOString();
      const idempotencyKey = 'res-updated-' + Date.now();

      const payload = JSON.stringify({
        id: eventId,
        event: "resource.updated",
        created_at: timestamp,
        data: {
          resource_id: "res_001",
          resource_type: "order",
          status: "fulfilled",
          previous_status: "pending",
          attributes: { name: "Test Order", amount: 9900, currency: "USD" }
        }
      });

      pm.request.body.raw = payload;
      pm.variables.set('idempotency_key', idempotencyKey);

      const secret = pm.environment.get('webhook_secret');
      if (secret) {
        const sig = CryptoJS.HmacSHA256(payload, secret).toString(CryptoJS.enc.Hex);
        pm.request.headers.upsert({ key: 'X-Webhook-Signature', value: 'sha256=' + sig });
      }
  - type: afterResponse
    code: |-
      pm.test('Hookdeck acknowledges with 200', () => {
        pm.response.to.have.status(200);
      });
      pm.test('Response contains request_id', () => {
        const body = pm.response.json();
        pm.expect(body).to.have.property('request_id').that.is.a('string');
      });
      pm.test('Response status is SUCCESS', () => {
        const body = pm.response.json();
        pm.expect(body.status).to.equal('SUCCESS');
      });
